[package]
name = "ocsess"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
description = "TUI to browse and manage OpenCode sessions"

[dependencies]
base64 = "0.23"
flate2 = "1"
ratatui = "0.30"
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false }

[profile.release]
strip = true
lto = "thin"
